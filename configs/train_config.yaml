# Training Configuration
# Medical Multimodal Retrieval System

# Dataset Configuration
dataset:
  train_csv: "data/processed/train_processed.csv"
  val_csv: "data/processed/val_processed.csv"
  test_csv: "data/processed/test_processed.csv"
  batch_size: 16
  num_workers: 4
  pin_memory: true
  
# Training Parameters
training:
  epochs: 20
  learning_rate: 1e-5
  weight_decay: 1e-4
  warmup_steps: 1000
  max_grad_norm: 1.0
  
# Optimizer Configuration
optimizer:
  type: "AdamW"
  betas: [0.9, 0.999]
  eps: 1e-8
  
# Learning Rate Scheduler
scheduler:
  type: "CosineAnnealingLR"
  T_max: 20
  eta_min: 1e-7
  
# Loss Configuration
loss:
  type: "ContrastiveLoss"
  temperature: 0.07
  label_smoothing: 0.1
  
# Mixed Precision Training
mixed_precision:
  enabled: true
  scaler: "GradScaler"
  
# Early Stopping
early_stopping:
  enabled: true
  patience: 5
  min_delta: 0.001
  
# Checkpointing
checkpointing:
  save_dir: "checkpoints"
  save_every: 5
  save_best: true
  metric: "val_loss"
  
# Logging
logging:
  log_dir: "outputs/logs"
  log_level: "INFO"
  log_every: 100
  
# Hardware
hardware:
  device: "auto"  # auto, cpu, cuda
  mixed_precision: true
  compile_model: false
  
# Validation
validation:
  eval_every: 1
  save_visualizations: true
  compute_metrics: ["retrieval_accuracy", "mean_reciprocal_rank"]
